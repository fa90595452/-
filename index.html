<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺雙殿人事系統 - Enterprise HR System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-purple-nav { background-color: #4a2d5e; }
        #map { height: 320px; width: 100%; border-radius: 0.75rem; }
        .birthday-gradient { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Top Purple Header -->
    <header class="bg-purple-nav text-white sticky top-0 z-50 shadow-md">
        <!-- Top Bar -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between border-b border-purple-800/50">
            <div class="flex items-center space-x-3">
                <span class="font-bold text-lg tracking-wide">臺雙殿人事系統</span>
                <span class="text-xs bg-purple-800 text-purple-200 px-2 py-0.5 rounded-full">版本 1151028-1630・測試中</span>
                <button onclick="location.reload()" class="text-xs bg-purple-700/60 hover:bg-purple-700 text-purple-100 px-2.5 py-1 rounded border border-purple-500/30 transition flex items-center space-x-1">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>重新整理</span>
                </button>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="text-right hidden md:block text-xs text-purple-200">
                    <span id="currentDate">2026年10月30日星期五</span>
                    <span id="currentTime" class="ml-2 font-mono font-bold text-white">10:32:00</span>
                </div>
                <!-- Role Selector -->
                <div class="flex items-center space-x-2 bg-purple-900/60 p-1 rounded-lg border border-purple-700/50 text-xs">
                    <span class="text-purple-300 pl-2">檢視身份</span>
                    <select id="roleSelector" onchange="switchRole()" class="bg-purple-800 text-white font-medium focus:outline-none cursor-pointer rounded px-2 py-1">
                        <option value="hr">人事 (全部)</option>
                        <option value="employee">一般員工 (個人視角)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center space-x-1 overflow-x-auto text-sm py-1 font-medium">
            <button onclick="switchTab('home')" id="nav-home" class="px-3 py-2 rounded-t-lg bg-white/10 text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-house text-xs"></i><span>首頁</span>
            </button>
            <button onclick="switchTab('checkin')" id="nav-checkin" class="px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-clock text-xs"></i><span>打卡總覽</span>
            </button>
            <button onclick="switchTab('attendance')" id="nav-attendance" class="px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-calendar-days text-xs"></i><span>出勤</span>
            </button>
            <button onclick="switchTab('approval')" id="nav-approval" class="px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-square-check text-xs"></i><span>表單簽核</span>
            </button>
            <button onclick="switchTab('employees')" id="nav-employees" class="px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-user-group text-xs"></i><span>員工・勞健保</span>
            </button>
            <button onclick="switchTab('payroll')" id="nav-payroll" class="px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-wallet text-xs"></i><span>薪資</span>
            </button>
            <button onclick="switchTab('docs')" id="nav-docs" class="px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-file-lines text-xs"></i><span>證明文件</span>
            </button>
            
            <!-- Admin Only Tabs -->
            <button onclick="switchTab('reports')" id="nav-reports" class="admin-only px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-chart-line text-xs"></i><span>報表</span>
            </button>
            <button onclick="switchTab('dashboard')" id="nav-dashboard" class="admin-only px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-stopwatch text-xs"></i><span>管理儀表</span>
            </button>
            <button onclick="switchTab('settings')" id="nav-settings" class="admin-only px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-gear text-xs"></i><span>設定</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Birthday Alert Banners -->
        <div id="companyBirthdayBanner" class="hidden birthday-gradient border border-pink-200 text-pink-900 rounded-xl p-4 shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-white/60 rounded-lg text-2xl">🎉</div>
                <div>
                    <h4 class="text-sm font-bold">今日壽星提醒！</h4>
                    <p id="birthdayNamesText" class="text-xs text-pink-800">今天有同仁過生日，快給予祝賀吧！</p>
                </div>
            </div>
            <span class="bg-white/80 text-pink-700 font-bold text-xs px-3 py-1.5 rounded-full shadow-sm">🎂 Today's Birthday</span>
        </div>

        <div id="personalBirthdayBanner" class="hidden bg-gradient-to-
