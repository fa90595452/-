<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智匯人事管理系統 - Enterprise HR System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        #map { height: 350px; width: 100%; border-radius: 1rem; }
        .birthday-gradient { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md">

                <div>
                    <h1 class="font-bold text-lg text-slate-800">智匯人事管理系統</h1>
                    <p class="text-xs text-slate-400">Enterprise HR & Geolocation System</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right hidden sm:block">

                    <div id="currentDate" class="text-xs text-slate-400">2026/10/30 (五)</div>
                </div>
                <div class="flex items-center space-x-2 bg-slate-100 p-1.5 rounded-full px-3">

                    <select id="userSelector" class="bg-transparent text-sm font-medium focus:outline-none cursor-pointer pr-2" onchange="switchUser()">
                        <!-- Dynamic Options -->
                    </select>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8">

        <aside class="lg:col-span-1 space-y-6">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-2">
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium transition-all bg-blue-50 text-blue-600">
                    <i class="fa-solid fa-chart-pie w-5"></i>
                    <span>儀表板總覽</span>
                </button>
