<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臺雙殿人事系統 - Enterprise HR System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .bg-purple-nav { background-color: #4a2d5e; }
        #map { height: 320px; width: 100%; border-radius: 0.75rem; }
        .birthday-gradient { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <!-- Top Purple Header -->
    <header class="bg-purple-nav text-white sticky top-0 z-50 shadow-md">
        <!-- Top Bar -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between border-b border-purple-800/50">
            <div class="flex items-center space-x-3">
                <span class="font-bold text-lg tracking-wide">臺雙殿人事系統</span>
                <span class="text-xs bg-purple-800 text-purple-200 px-2 py-0.5 rounded-full">版本 1151028-1630・RBAC即時切換版</span>
                <button onclick="clearAndReload()" class="text-xs bg-purple-700/60 hover:bg-purple-700 text-purple-100 px-2.5 py-1 rounded border border-purple-500/30 transition flex items-center space-x-1">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>重置資料並刷新</span>
                </button>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="text-right hidden md:block text-xs text-purple-200">
                    <span id="currentDate">2026年10月30日星期五</span>
                    <span id="currentTime" class="ml-2 font-mono font-bold text-white">10:32:00</span>
                </div>
                <!-- Role Selector -->
                <div class="flex items-center space-x-2 bg-purple-900/60 p-1 rounded-lg border border-purple-700/50 text-xs">
                    <span class="text-purple-300 pl-2">檢視身份</span>
                    <select id="roleSelector" onchange="switchRole()" class="bg-purple-800 text-white font-medium focus:outline-none cursor-pointer rounded px-2 py-1">
                        <option value="hr">HR 人事管理員</option>
                        <option value="manager">部門主管</option>
                        <option value="employee">一般員工</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Navigation Bar -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center space-x-1 overflow-x-auto text-sm py-1 font-medium">
            <button onclick="switchTab('checkin')" id="nav-checkin" class="nav-tab px-3 py-2 rounded-t-lg bg-white/10 text-white flex items-center space-x-1.5 whitespace-nowrap font-bold border-b-2 border-white">
                <i class="fa-solid fa-clock text-xs"></i><span>打卡總覽</span>
            </button>
            <button onclick="switchTab('attendance')" id="nav-attendance" class="nav-tab role-hr-mgr px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-calendar-days text-xs"></i><span>出勤紀錄</span>
            </button>
            <button onclick="switchTab('employees')" id="nav-employees" class="nav-tab role-hr-only px-3 py-2 rounded-t-lg hover:bg-white/10 text-purple-200 hover:text-white flex items-center space-x-1.5 whitespace-nowrap">
                <i class="fa-solid fa-user-group text-xs"></i><span>員工管理</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- System Announcement -->
        <div class="bg-white rounded-xl p-4 border border-slate-200/80 shadow-sm">
            <div class="flex items-center justify-between mb-2">
                <h3 class="font-bold text-slate-800 text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-bullhorn text-purple-600"></i>
                    <span>最新公告</span>
                </h3>
            </div>
            <p class="text-xs text-slate-500 leading-relaxed">
                <span class="font-semibold text-slate-700">2026-10-17：</span> 人事系統測試中，已開放切換角色體驗真實介面權限隔離。
            </p>
        </div>

        <!-- PAGE 1: CHECKIN (打卡總覽 & GPS 定位) -->
        <div id="tab-checkin" class="space-y-6">

            <!-- 壽星提醒 (只有 HR 角色呈現) -->
            <div id="companyBirthdayBanner" class="hidden birthday-gradient border border-pink-200 text-pink-900 rounded-xl p-4 shadow-sm flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-white/60 rounded-lg text-2xl">🎉</div>
                    <div>
                        <h4 class="text-sm font-bold">【HR 專屬提醒】今日公司壽星名單！</h4>
                        <p id="birthdayNamesText" class="text-xs text-pink-800">今天有同仁過生日，別忘了送上祝賀！</p>
                    </div>
                </div>
                <span class="bg-white/80 text-pink-700 font-bold text-xs px-3 py-1.5 rounded-full shadow-sm">🎂 Today's Birthday</span>
            </div>

            <!-- 壽星祝福 (部門主管 & 一般員工 呈現) -->
            <div id="personalBirthdayBanner" class="hidden bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white rounded-xl p-5 shadow-lg">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="flex items-center space-x-4">
                        <div class="text-3xl bg-white/20 p-2.5 rounded-xl">🎂</div>
                        <div>
                            <h3 class="text-lg font-bold">親愛的 <span id="birthdayUserName">同仁</span>，生日快樂！✨</h3>
                            <p class="text-xs text-pink-100 mt-0.5">臺雙殿人事系統祝您新的一歲工作順心、平安喜樂！🎈</p>
                        </div>
                    </div>
                    <button onclick="triggerConfetti()" class="bg-white text-pink-600 font-bold text-xs px-4 py-2 rounded-lg shadow hover:bg-pink-50">撒花慶祝！</button>
                </div>
            </div>

            <!-- HR 專屬：累積忘卡滿 5 次警示區 -->
            <div id="hrMissingAlertBox" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-4 shadow-sm space-y-2">
                <div class="flex items-center space-x-2 text-amber-800 font-bold text-sm">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>【HR 追蹤】本月忘卡累積達 5 次（含以上）人員警示</span>
                </div>
                <div id="hrMissingList" class="text-xs text-amber-700 flex flex-wrap gap-2 pt-1">
                </div>
            </div>

            <div class="bg-white rounded-xl p-6 border border-slate-200 shadow-sm space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="font-bold text-slate-800 text-base flex items-center space-x-2">
                        <i class="fa-solid fa-location-dot text-purple-600"></i>
                        <span>即時 GPS / WFH 考勤打卡</span>
                    </h3>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-slate-500">切換測試人員：</span>
                        <select id="userSelector" class="bg-slate-100 border border-slate-200 text-xs font-semibold rounded px-2.5 py-1" onchange="switchUser()">
