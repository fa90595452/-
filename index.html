<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 防快取 (No-Cache) 機制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>智匯人事管理系統 - 員工極速打卡測試</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        #map { height: 300px; width: 100%; border-radius: 1rem; }
        @media (min-width: 640px) { #map { height: 380px; } }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

    <div>
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
            <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 text-white p-2 rounded-xl shadow-md">
                        <i class="fa-solid fa-users-gear text-lg sm:text-xl"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm sm:text-base text-slate-800">智匯人事考勤系統 <span class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full ml-1 font-semibold">測試版</span></h1>
                        <p class="text-[10px] text-slate-400">Personal Check-in Portal</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <div class="text-right hidden sm:block mr-2">
                        <div id="currentTime" class="text-xs font-semibold text-slate-700">16:50:00</div>
                        <div id="currentDate" class="text-[10px] text-slate-400">2026/10/30 (五)</div>
                    </div>
                    <div class="flex items-center space-x-1.5 bg-slate-100 p-1.5 rounded-full px-3 border border-slate-200">
                        <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-[11px]" id="avatarText">蕭</div>
                        <select id="userSelector" class="bg-transparent text-xs font-bold focus:outline-none cursor-pointer pr-1" onchange="switchUser()">
                        </select>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-4xl mx-auto px-4 py-6 space-y-6">

            <!-- 個人問候卡片 -->
            <div class="bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 rounded-3xl p-6 text-white shadow-xl space-y-3">
                <div class="flex items-start justify-between">
                    <div class="flex items-center space-x-3.5">
                        <div class="w-12 h-12 rounded-2xl bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center font-bold text-xl text-white shadow-inner" id="greetingAvatar">
                            蕭
                        </div>
                        <div>
                            <h2 class="font-bold text-lg sm:text-2xl flex items-center space-x-2">
                                <span id="userGreetingText">蕭千雯 (A001008)，午安！☕</span>
                            </h2>
                            <p id="userEmpInfoText" class="text-xs text-blue-100 mt-1 font-medium">工號：A001008 | 部門：部門四 | 職稱：資料庫管理 / HR主管</p>
                        </div>
                    </div>
                    <span id="currentModeBadge" class="hidden sm:inline-block bg-white/20 backdrop-blur-md text-white border border-white/30 text-xs font-semibold px-3 py-1 rounded-full">公司辦公</span>
                </div>
                <div class="pt-3 border-t border-white/20 mt-2">
                    <p id="motivationalQuote" class="text-xs sm:text-sm text-blue-50 font-medium italic leading-relaxed">
                        💬「每一天的努力，都在為更好的自己積蓄力量！」
                    </p>
                </div>
            </div>

            <!-- 打卡地圖卡片 -->
            <div class="bg-white rounded-3xl p-5 sm:p-7 border border-slate-100 shadow-sm space-y-5">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-800 flex items-center space-x-2 text-base">
                        <i class="fa-solid fa-street-view text-blue-600 text-lg"></i>
                        <span>即時考勤定位打卡</span>
                    </h3>
                    <span class="text-xs text-slate-400 font-medium">GPS 範圍 200M</span>
                </div>

                <div id="map" class="shadow-inner border border-slate-100"></div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100/80">
                        <p class="text-[11px] text-slate-400 font-semibold uppercase tracking-wider">即時 GPS 定位狀態</p>
                        <p id="geoStatusText" class="text-xs sm:text-sm font-bold text-slate-700 mt-1 flex items-center space-x-1.5">
                            <i class="fa-solid fa-circle-notch fa-spin text-blue-500"></i>
                            <span>定位獲取中...</span>
                        </p>
                    </div>
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100/80">
                        <p class="text-[11px] text-slate-400 font-semibold uppercase tracking-wider">與最近公司據點距離</p>
                        <p id="geoDistanceText" class="text-base sm:text-lg font-extrabold text-blue-600 mt-1">-- 公尺</p>
                    </div>
                </div>

                <div class="pt-2">
                    <button id="smartPunchBtn" onclick="performSmartCheckin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center space-y-1 active:scale-[0.99]">
                        <div class="flex items-center space-x-2 text-base sm:text-lg">
                            <i id="smartPunchIcon" class="fa-solid fa-fingerprint"></i>
                            <span id="smartPunchText">讀取打卡狀態中...</span>
                        </div>
                        <span id="smartPunchSubtext" class="text-[11px] font-normal opacity-80">點擊完成今日考勤登記</span>
                    </button>
                </div>
            </div>

        </main>
    </div>

    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white mt-8">
        智匯人事考勤系統 &copy; 2026 Enterprise HR System
    </footer>

    <script>
        // 已更正「台北 SoR 總部」經緯度（校正至羅斯福路四段68號15樓）
        const COMPANY_TARGETS = [
            { id: "SOR_HQ", name: "台北 SoR 總部", lat: 25.01372, lng: 121.53488, radius: 250 },
            { id: "YONGHE_WH", name: "永和倉庫", lat: 25.00030, lng: 121.52180, radius: 250 }
        ];

        const MOTIVATIONAL_QUOTES = [
            "每一天的努力，都在為更好的自己積蓄力量！",
            "保持熱愛，奔赴山海！今天的你依然無堅不摧！",
            "專注眼前的小事，成就未來的繁星！",
            "辛苦了！今天的每一份付出，公司都深刻感謝！",
            "保持微笑與專注，今天又是充滿可能的一天！"
        ];

        let employees = JSON.parse(localStorage.getItem('hr_employees_v2.2')) || [];
        let checkinRecords = JSON.parse(localStorage.getItem('hr_records_v2.2')) || [];
        let currentUserIndex = 0;
        let map, userMarker, currentDistance = 9999;

        window.onload = function() {
            renderUserSelector();
            startClock();
            initMap();
            updateUserDisplay();
        };

        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById('currentTime').innerText = now.toTimeString().split(' ')[0];
            }, 1000);
        }

        function renderUserSelector() {
            const selector = document.getElementById('userSelector');
            selector.innerHTML = '';
            if (employees.length === 0) return;

            employees.forEach((emp, index) => {
                const opt = document.createElement('option');
                opt.value = index;
                opt.innerText = `${emp.name} (${emp.dept || '未定'})`;
                selector.appendChild(opt);
            });

            selector.value = currentUserIndex;
        }

        function switchUser() {
            currentUserIndex = parseInt(document.getElementById('userSelector').value);
            updateUserDisplay();
        }

        function updateUserDisplay() {
            if (employees.length === 0) return;
            const user = employees[currentUserIndex];
            
            document.getElementById('avatarText').innerText = user.name.substring(0, 1);
            document.getElementById('greetingAvatar').innerText = user.name.substring(0, 1);

            const hour = new Date().getHours();
            let timeGreeting = "早安！☀️";
            if (hour >= 12 && hour < 18) timeGreeting = "午安！☕";
            else if (hour >= 18 || hour < 5) timeGreeting = "晚安！🌙";

            document.getElementById('userGreetingText').innerText = `${user.name} (${user.id})，${timeGreeting}`;
            document.getElementById('userEmpInfoText').innerText = `工號：${user.id} | 部門：${user.dept || '未定'} | 職稱：${user.title || '專員'}`;
            document.getElementById('currentModeBadge').innerText = user.mode || "公司辦公";

            const randomQuote = MOTIVATIONAL_QUOTES[Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length)];
            document.getElementById('motivationalQuote').innerText = `💬「${randomQuote}」`;

            updateSmartPunchButton();
        }

        function updateSmartPunchButton() {
            if (employees.length === 0) return;
            const user = employees[currentUserIndex];
            const todayStr = new Date().toISOString().split('T')[0];

            const todayLogs = checkinRecords.filter(r => r.empId === user.id && r.attDate === todayStr);
            const hasIn = todayLogs.find(r => r.type === '上班');
            const hasOut = todayLogs.find(r => r.type === '下班');

            const btnText = document.getElementById('smartPunchText');
            const btnSubtext = document.getElementById('smartPunchSubtext');
            const btnIcon = document.getElementById('smartPunchIcon');
            const btn = document.getElementById('smartPunchBtn');

            if (!hasIn) {
                btnText.innerText = "完成上班打卡";
                btnSubtext.innerText = `登錄同仁：${user.name} (${user.id})`;
                btnIcon.className = "fa-solid fa-right-to-bracket";
                btn.className = "w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center space-y-1 active:scale-[0.99]";
            } else if (!hasOut) {
                btnText.innerText = "完成下班打卡";
                btnSubtext.innerText = `已於 ${hasIn.timeOnly || ''} 上班打卡，按下登記下班`;
                btnIcon.className = "fa-solid fa-person-walking-arrow-right";
                btn.className = "w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex flex-col items-center justify-center space-y-1 active:scale-[0.99]";
            } else {
                btnText.innerText = "今日打卡已全數完成";
                btnSubtext.innerText = `上班: ${hasIn.timeOnly} / 下班: ${hasOut.timeOnly}`;
                btnIcon.className = "fa-solid fa-circle-check";
                btn.className = "w-full bg-slate-700 hover:bg-slate-800 text-white font-bold py-4 rounded-2xl shadow-md transition-all flex flex-col items-center justify-center space-y-1 active:scale-[0.99]";
            }
        }

        // 計算距離 (Haversine Formula)
        function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function initMap() {
